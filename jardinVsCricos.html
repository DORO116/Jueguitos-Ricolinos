<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jardín vs. Cricos</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background: #17251b;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    color: #a9ed79;
    margin-bottom: 12px;
}

#game {
    width: 900px;
    max-width: 100%;
    margin: auto;
    position: relative;
}

#topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
    padding: 10px;
    background: #344e32;
    border: 3px solid #20351f;
    border-radius: 10px 10px 0 0;
}

#sunCounter, #levelInfo {
    font-weight: bold;
    font-size: 17px;
}
    
#levelPanel {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    min-width: 145px;
}

#progressTrack {
    width: 130px;
    height: 12px;
    background: #263b23;
    border: 2px solid #20351f;
    border-radius: 10px;
    overflow: hidden;
}

#progressFill {
    width: 0%;
    height: 100%;
    background: #f3df78;
    border-radius: 10px;
    transition: width 0.2s ease;
}
    
#plantCards {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
    justify-content: center;
}

.plant-card {
    position: relative;
    width: 68px;
    height: 76px;
    background: #d9c88c;
    border: 3px solid #79683c;
    border-radius: 7px;
    color: #222;
    cursor: pointer;
    padding: 3px;
    overflow: hidden;
}

.plant-card.selected {
    border-color: #fff;
    background: #a9e78c;
}

.plant-card.disabled {
    filter: brightness(.55);
}

.plant-card .emoji {
    display: block;
    font-size: 29px;
}

.plant-card .cost {
    font-size: 12px;
    font-weight: bold;
}

.cooldown {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,.55);
    transform-origin: bottom;
    pointer-events: none;
}

#shovel {
    width: 68px;
    height: 76px;
    border: 3px solid #79683c;
    border-radius: 7px;
    background: #b6a477;
    font-size: 29px;
    cursor: pointer;
}

#shovel.selected {
    border-color: white;
    background: #a9e78c;
}

canvas {
    display: block;
    width: 100%;
    height: auto;
    background: #77bd51;
    border: 3px solid #20351f;
    cursor: crosshair;
}

#overlay {
    position: absolute;
    inset: 0;
    top: 100px;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,.72);
    z-index: 10;
}

#overlay.show {
    display: flex;
}

#overlayBox {
    background: #e7d69b;
    color: #26351d;
    border: 5px solid #66532d;
    border-radius: 14px;
    padding: 25px;
    width: 80%;
    max-width: 440px;
}

#overlayBox h2 {
    margin-top: 0;
    font-size: 27px;
}

#overlayBox p {
    line-height: 1.5;
}

#overlayBox button {
    display: block;
    width: 100%;
    margin-top: 12px;
    padding: 12px;
    border: 0;
    border-radius: 8px;
    background: #4b923d;
    color: white;
    font-weight: bold;
    font-size: 16px;
    cursor: pointer;
}

#overlayBox button:hover {
    background: #36732d;
}

#help {
    color: #d5e7ce;
    font-size: 13px;
    margin-top: 10px;
}
</style>
</head>

<body>

<h1>🌻 Jardín vs. Cricos 🧟 REMAKE</h1>

<div id="game">

    <div id="topbar">
        <div id="sunCounter">☀️ 150</div>
        <div id="plantCards"></div>
        <button id="shovel" title="Pala">🪓</button>
        <div id="levelPanel">
        <div id="levelInfo">Nivel 1</div>
        <div id="progressTrack">
        <div id="progressFill"></div>
    </div>
</div>
    </div>

    <canvas id="canvas" width="900" height="500"></canvas>

    <div id="overlay">
        <div id="overlayBox"></div>
    </div>

</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const CELL_W = 90;
const CELL_H = 100;
const ROWS = 5;
const COLS = 9;
const OFFSET = 90;

let state = "MENU";
let sun = 150;
let level = 1;
let frame = 0;
let tool = null;

let plants = [];
let zombies = [];
let bullets = [];
let suns = [];
let mowers = [];
let fx = [];

let spawned = 0;
let killed = 0;

let infiniteMode = false;
let infiniteWave = 1;

const PLANTS = {
    sunflower: {
        name: "Girasol",
        cost: 50,
        hp: 100,
        emoji: "🌻",
        cd: 300
    },

    peashooter: {
        name: "Lanzaguisantes",
        cost: 100,
        hp: 120,
        emoji: "🌱",
        cd: 300
    },

    wallnut: {
        name: "Nuez",
        cost: 50,
        hp: 600,
        emoji: "🥜",
        cd: 600
    },

    snowpea: {
        name: "Hielaguisantes",
        cost: 175,
        hp: 120,
        emoji: "❄️",
        cd: 400
    },

    cherrybomb: {
        name: "Cereza",
        cost: 150,
        hp: 50,
        emoji: "🍒",
        cd: 900
    },

    potatoMine: {
        name: "Patatapum",
        cost: 25,
        hp: 100,
        emoji: "🟤",
        cd: 600
    }
};

const ZOMBIES = {
    normal: {
        hp: 120,
        speed: 0.45,
        damage: 0.5,
        emoji: "🧟"
    },

    cone: {
        hp: 260,
        speed: 0.45,
        damage: 0.5,
        emoji: "🔺"
    },

    bucket: {
        hp: 480,
        speed: 0.4,
        damage: 0.6,
        emoji: "🪣"
    },

    runner: {
        hp: 140,
        speed: 0.9,
        damage: 0.5,
        emoji: "🏃"
    },

    boss: {
        hp: 1200,
        speed: 0.3,
        damage: 1.5,
        emoji: "🤖"
    }
};

const LEVELS = {
    1: {
        total: 8,
        rate: 380,
        types: ["normal"],
        sun: 150
    },

    2: {
        total: 14,
        rate: 320,
        types: ["normal", "cone"],
        sun: 150
    },

    3: {
        total: 20,
        rate: 260,
        types: ["normal", "cone", "runner"],
        sun: 200
    },

    4: {
        total: 28,
        rate: 210,
        types: ["normal", "cone", "bucket", "runner"],
        sun: 200
    },

    5: {
        total: 38,
        rate: 170,
        types: ["normal", "cone", "bucket", "runner", "boss"],
        sun: 250
    }
};

let currentConfig = LEVELS[1];

// -----------------------------
// INTERFAZ
// -----------------------------

function initUI() {
    const container = document.getElementById("plantCards");
    container.innerHTML = "";

    for (const [key, plant] of Object.entries(PLANTS)) {
        const card = document.createElement("button");

        card.className = "plant-card";
        card.id = "card-" + key;

        card.innerHTML = `
            <span class="emoji">${plant.emoji}</span>
            <span class="cost">☀️ ${plant.cost}</span>
            <div class="cooldown" id="cooldown-${key}"></div>
        `;

        card.title = plant.name;

        card.onclick = () => elegirHerramienta(key);

        container.appendChild(card);
    }

    document.getElementById("shovel").onclick = () => {
        if (state !== "PLAYING") return;

        tool = tool === "shovel" ? null : "shovel";
        actualizarUI();
    };
}

function elegirHerramienta(type) {
    if (state !== "PLAYING") return;

    const p = PLANTS[type];

    if (sun < p.cost) return;

    tool = tool === type ? null : type;
    actualizarUI();
}

function actualizarUI() {
    document.getElementById("sunCounter").textContent = "☀️ " + sun;

    document.getElementById("levelInfo").textContent =
        infiniteMode
            ? "Infinito - Oleada " + infiniteWave
            : "Nivel " + level;
    const progress = currentConfig.total > 0
    ? Math.min(100, (killed / currentConfig.total) * 100)
    : 0;

document.getElementById("progressFill").style.width = progress + "%";

    for (const [key, plant] of Object.entries(PLANTS)) {
        const card = document.getElementById("card-" + key);
        const cooldown = document.getElementById("cooldown-" + key);

        const remaining = Math.max(0, plant.cd - (frame - plant.last));

        card.classList.toggle("selected", tool === key);
        card.classList.toggle("disabled", sun < plant.cost || remaining > 0);

        cooldown.style.transform =
            `scaleY(${remaining / plant.cd})`;
    }

    document.getElementById("shovel").classList.toggle(
        "selected",
        tool === "shovel"
    );
}

// -----------------------------
// CONFIGURACIÓN DE NIVELES
// -----------------------------

function configurarNivel(n) {
    currentConfig = LEVELS[n];

    sun = currentConfig.sun;
    frame = 0;

    plants = [];
    zombies = [];
    bullets = [];
    suns = [];
    fx = [];

    spawned = 0;
    killed = 0;
    tool = null;

    mowers = [];

    for (let r = 0; r < ROWS; r++) {
        mowers.push({
            row: r,
            x: OFFSET - 45,
            active: true,
            moving: false
        });
    }

    for (const p of Object.values(PLANTS)) {
        p.last = -1000;
    }

    actualizarUI();
}

function configurarOleadaInfinita() {
    const wave = infiniteWave;

    const types = ["normal"];

    if (wave >= 2) types.push("cone");
    if (wave >= 3) types.push("runner");
    if (wave >= 4) types.push("bucket");
    if (wave >= 6) types.push("boss");

    currentConfig = {
        total: 10 + wave * 3,
        rate: Math.max(65, 180 - wave * 8),
        types: types
    };

    frame = 0;
    spawned = 0;
    killed = 0;

    zombies = [];
    bullets = [];
    suns = [];
    fx = [];

    // Las plantas y cortacéspedes se conservan entre oleadas.
    actualizarUI();
}

function iniciarJuego() {
    infiniteMode = false;
    infiniteWave = 1;
    level = 1;

    configurarNivel(level);

    state = "PLAYING";
    ocultarOverlay();
}

function siguienteNivel() {
    level++;

    configurarNivel(level);

    state = "PLAYING";
    ocultarOverlay();
}

function iniciarInfinito() {
    infiniteMode = true;
    infiniteWave = 1;

    configurarNivel(5);
    configurarOleadaInfinita();

    state = "PLAYING";
    ocultarOverlay();
}

function reiniciarJuego() {
    iniciarJuego();
}

// -----------------------------
// OVERLAYS
// -----------------------------

function mostrarOverlay(title, message, buttons) {
    const overlay = document.getElementById("overlay");
    const box = document.getElementById("overlayBox");

    box.innerHTML = `
        <h2>${title}</h2>
        <p>${message}</p>
        ${buttons}
    `;

    overlay.classList.add("show");
}

function ocultarOverlay() {
    document.getElementById("overlay").classList.remove("show");
}

function pantallaInicio() {
    state = "MENU";

    mostrarOverlay(
        "🌻 Jardín vs. Cricos",
        "¡Defiende tu jardín de los cricos!<br>Coloca plantas, recoge soles y evita que lleguen a tu casa.",
        `<button onclick="iniciarJuego()">Comenzar campaña</button>`
    );
}

function pantallaGameOver() {
    state = "GAMEOVER";

    const extra = infiniteMode
        ? `<p>Oleadas superadas: ${infiniteWave - 1}</p>`
        : `<p>Llegaste al nivel ${level}.</p>`;

    mostrarOverlay(
        "🧟 ¡Los cricos ganaron!",
        extra + " Tu jardín ha sido invadido.",
        `<button onclick="reiniciarJuego()">Volver a empezar</button>`
    );
}

function pantallaNivelCompletado() {
    state = "LEVEL";

    mostrarOverlay(
        "¡Nivel completado! 🌻",
        "Has eliminado a todos los cricos de este nivel.",
        `<button onclick="siguienteNivel()">Siguiente nivel</button>`
    );
}

function pantallaVictoria() {
    state = "WON";

    mostrarOverlay(
        "🏆 ¡Jardín salvado!",
        "¡Completaste los cinco niveles de la campaña!<br><br>Has desbloqueado el modo infinito. ¿Cuántas oleadas podrás resistir?",
        `
        <button onclick="iniciarInfinito()">♾️ Jugar modo infinito</button>
        <button onclick="reiniciarJuego()">Volver a jugar campaña</button>
        `
    );
}

function pantallaSiguienteOleada() {
    state = "WAVE";

    mostrarOverlay(
        "¡Oleada superada! 🌻",
        `Has sobrevivido a la oleada ${infiniteWave}.<br>La siguiente será más difícil.`,
        `<button onclick="continuarInfinito()">Siguiente oleada</button>`
    );
}

function continuarInfinito() {
    infiniteWave++;

    sun += 50;

    configurarOleadaInfinita();

    state = "PLAYING";
    ocultarOverlay();
}

// -----------------------------
// COLOCAR Y QUITAR PLANTAS
// -----------------------------

function obtenerPlanta(col, row) {
    return plants.find(p => p.col === col && p.row === row);
}

function colocarPlanta(col, row, type) {
    const data = PLANTS[type];

    if (obtenerPlanta(col, row)) return;

    if (sun < data.cost) return;

    const remaining = data.cd - (frame - data.last);

    if (remaining > 0) return;

    sun -= data.cost;
    data.last = frame;

    plants.push({
        col,
        row,
        x: OFFSET + col * CELL_W,
        y: row * CELL_H,
        type,
        hp: data.hp,
        maxHp: data.hp,
        timer: 0,
        armed: false
    });

    tool = null;
    actualizarUI();
}

function quitarPlanta(col, row) {
    const index = plants.findIndex(
        p => p.col === col && p.row === row
    );

    if (index !== -1) {
        plants.splice(index, 1);
    }

    tool = null;
    actualizarUI();
}

// -----------------------------
// EVENTOS DEL CANVAS
// -----------------------------

canvas.addEventListener("click", function(e) {
    if (state !== "PLAYING") return;

    const rect = canvas.getBoundingClientRect();

    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;

    const x = (e.clientX - rect.left) * scaleX;
    const y = (e.clientY - rect.top) * scaleY;

    // Recoger soles.
    for (let i = suns.length - 1; i >= 0; i--) {
        const s = suns[i];

        if (Math.hypot(x - s.x, y - s.y) < 35) {
            sun += s.value;
            suns.splice(i, 1);
            actualizarUI();
            return;
        }
    }

    const col = Math.floor((x - OFFSET) / CELL_W);
    const row = Math.floor(y / CELL_H);

    if (col < 0 || col >= COLS || row < 0 || row >= ROWS) {
        return;
    }

    if (tool === "shovel") {
        quitarPlanta(col, row);
        return;
    }

    if (tool && PLANTS[tool]) {
        colocarPlanta(col, row, tool);
    }
});

// -----------------------------
// GENERACIÓN DE ZOMBIS
// -----------------------------

function crearZombie() {
    if (spawned >= currentConfig.total) return;

    const type = currentConfig.types[
        Math.floor(Math.random() * currentConfig.types.length)
    ];

    const data = ZOMBIES[type];

    let hpMultiplier = 1;
    let speedMultiplier = 1;

    if (infiniteMode) {
        hpMultiplier = 1 + (infiniteWave - 1) * 0.12;
        speedMultiplier = Math.min(
            1.6,
            1 + (infiniteWave - 1) * 0.025
        );
    }

    const row = Math.floor(Math.random() * ROWS);

    zombies.push({
        x: 920,
        y: row * CELL_H + 50,
        row,
        type,
        hp: data.hp * hpMultiplier,
        maxHp: data.hp * hpMultiplier,
        speed: data.speed * speedMultiplier,
        damage: data.damage,
        emoji: data.emoji,
        attackTimer: 0,
        slow: 0
    });

    spawned++;
}

// -----------------------------
// EXPLOSIONES
// -----------------------------

function explosion(x, y, radius, damage) {
    fx.push({
        x,
        y,
        radius,
        timer: 35,
        maxTimer: 35
    });

    for (const z of zombies) {
        const distance = Math.hypot(z.x - x, z.y - y);

        if (distance <= radius) {
            z.hp -= damage;
        }
    }
}

// -----------------------------
// ACTUALIZACIÓN DEL JUEGO
// -----------------------------

function actualizar() {
    if (state !== "PLAYING") return;

    frame++;

    // Generar soles.
    if (frame % 350 === 0) {
        suns.push({
            x: OFFSET + Math.random() * (COLS * CELL_W),
            y: 20,
            targetY: 70 + Math.random() * 300,
            value: 50,
            timer: 600
        });
    }

    // Generar zombis.
    if (
        spawned < currentConfig.total &&
        frame % currentConfig.rate === 0
    ) {
        crearZombie();
    }

    // Movimiento de soles.
    for (let i = suns.length - 1; i >= 0; i--) {
        const s = suns[i];

        if (s.y < s.targetY) {
            s.y += 1.2;
        }

        s.timer--;

        if (s.timer <= 0) {
            suns.splice(i, 1);
        }
    }

    // Actualizar plantas.
    for (let i = plants.length - 1; i >= 0; i--) {
        const p = plants[i];

        p.timer++;

        // Girasol.
        if (p.type === "sunflower") {
            if (p.timer % 1080 === 0) {
                suns.push({
                    x: p.x + 45,
                    y: p.y + 35,
                    targetY: p.y + 70,
                    value: 50,
                    timer: 600
                });
            }
        }

        // Lanzaguisantes y hielaguisantes.
        if (
            p.type === "peashooter" ||
            p.type === "snowpea"
        ) {
            const enemyInRow = zombies.some(
                z => z.row === p.row && z.x > p.x
            );

            if (enemyInRow && p.timer % 125 === 0) {
                bullets.push({
                    x: p.x + 65,
                    y: p.y + 50,
                    row: p.row,
                    damage: 25,
                    ice: p.type === "snowpea"
                });
            }
        }

        // CEREZA EXPLOSIVA.
        if (p.type === "cherrybomb") {
            if (p.timer >= 45) {
                explosion(
                    p.x + 45,
                    p.y + 50,
                    160,
                    800
                );

                plants.splice(i, 1);
            }
        }

        // PATATAPUM.
        if (p.type === "potatoMine") {

            // Se prepara bajo tierra durante 15 segundos.
            if (p.timer >= 900) {
                p.armed = true;
            }

            // Cuando está armada, explota al contacto con un zombi.
            if (p.armed) {
                const touchingZombie = zombies.some(z =>
                    z.row === p.row &&
                    z.x >= p.x + 5 &&
                    z.x <= p.x + 85
                );

                if (touchingZombie) {
                    explosion(
                        p.x + 45,
                        p.y + 50,
                        115,
                        2000
                    );

                    plants.splice(i, 1);
                }
            }
        }

        if (p.hp <= 0) {
            plants.splice(i, 1);
        }
    }

    // Actualizar proyectiles.
    for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];

        b.x += 6;

        let hit = false;

        for (const z of zombies) {
            if (
                z.row === b.row &&
                Math.abs(z.x - b.x) < 28
            ) {
                z.hp -= b.damage;

                if (b.ice) {
                    z.slow = 180;
                }

                hit = true;
                break;
            }
        }

        if (hit || b.x > 920) {
            bullets.splice(i, 1);
        }
    }

    // Actualizar zombis.
    for (let i = zombies.length - 1; i >= 0; i--) {
        const z = zombies[i];

        if (z.hp <= 0) {
            zombies.splice(i, 1);
            killed++;
            continue;
        }

        if (z.slow > 0) {
            z.slow--;
        }

        const plant = plants.find(p =>
            p.row === z.row &&
            z.x >= p.x + 15 &&
            z.x <= p.x + 80
        );

        if (plant) {
            // Los zombis no pueden comerse una Patatapum.
            // Si aún no está armada, siguen caminando.
            if (plant.type === "potatoMine") {
                if (!plant.armed) {
                    z.x -= z.slow > 0 ? z.speed * 0.5 : z.speed;
                }
            } else {
                z.attackTimer++;

                if (z.attackTimer % 60 === 0) {
                    plant.hp -= z.damage * 60;
                }
            }
        } else {
            z.x -= z.slow > 0
                ? z.speed * 0.5
                : z.speed;
        }

        // Si llega a la izquierda, activa el cortacésped.
        if (z.x < OFFSET - 10) {
            const mower = mowers[z.row];

            if (mower.active && !mower.moving) {
                mower.moving = true;
            } else if (!mower.active) {
                pantallaGameOver();
                return;
            }
        }
    }

    // Cortacéspedes.
    for (const mower of mowers) {
        if (!mower.moving) continue;

        mower.x += 8;

        for (let i = zombies.length - 1; i >= 0; i--) {
            const z = zombies[i];

            if (
                z.row === mower.row &&
                Math.abs(z.x - mower.x) < 45
            ) {
                zombies.splice(i, 1);
                killed++;
            }
        }

        if (mower.x > 920) {
            mower.active = false;
            mower.moving = false;
        }
    }

    // Efectos de explosiones.
    for (let i = fx.length - 1; i >= 0; i--) {
        fx[i].timer--;

        if (fx[i].timer <= 0) {
            fx.splice(i, 1);
        }
    }

    // Comprobar final de oleada o nivel.
    if (
        spawned >= currentConfig.total &&
        zombies.length === 0
    ) {
        if (infiniteMode) {
            pantallaSiguienteOleada();
        } else if (level < 5) {
            pantallaNivelCompletado();
        } else {
            pantallaVictoria();
        }

        return;
    }

    if (frame % 10 === 0) {
        actualizarUI();
    }
}

// -----------------------------
// DIBUJAR TABLERO
// -----------------------------

function dibujarTablero() {
    ctx.fillStyle = "#78bd50";
    ctx.fillRect(0, 0, 900, 500);

    for (let row = 0; row < ROWS; row++) {
        for (let col = 0; col < COLS; col++) {
            ctx.fillStyle =
                (row + col) % 2 === 0
                    ? "#8bcf62"
                    : "#80c456";

            ctx.fillRect(
                OFFSET + col * CELL_W,
                row * CELL_H,
                CELL_W,
                CELL_H
            );

            ctx.strokeStyle = "rgba(40,90,30,.2)";
            ctx.strokeRect(
                OFFSET + col * CELL_W,
                row * CELL_H,
                CELL_W,
                CELL_H
            );
        }
    }

    // Casa.
    ctx.fillStyle = "#d4b47a";
    ctx.fillRect(0, 0, OFFSET, 500);

    ctx.font = "45px Arial";
    ctx.fillText("", 15, 260);

    // Cortacéspedes.
    for (const mower of mowers) {
        if (mower.active) {
            ctx.font = "35px Arial";
            ctx.fillText(
                "🚜",
                mower.x,
                mower.row * CELL_H + 65
            );
        }
    }
}

// -----------------------------
// DIBUJAR PLANTAS
// -----------------------------

function dibujarPlantas() {
    for (const p of plants) {
        const data = PLANTS[p.type];

        ctx.font = "42px Arial";
        ctx.textAlign = "center";

        let emoji = data.emoji;

        if (p.type === "potatoMine") {
            // Enterrada mientras se prepara.
            emoji = p.armed ? "🥔" : "🟤";
        }

        ctx.fillText(
            emoji,
            p.x + 45,
            p.y + 65
        );

        // Barra de vida.
        if (
            p.type !== "potatoMine" ||
            p.armed
        ) {
            const width = 55;
            const hpPercent = Math.max(0, p.hp / p.maxHp);

            ctx.fillStyle = "#542b20";
            ctx.fillRect(p.x + 17, p.y + 8, width, 6);

            ctx.fillStyle = "#5ae052";
            ctx.fillRect(
                p.x + 17,
                p.y + 8,
                width * hpPercent,
                6
            );
        }

        // Indicador de preparación de Patatapum.
        if (
            p.type === "potatoMine" &&
            !p.armed
        ) {
            const progress = Math.min(1, p.timer / 900);

            ctx.fillStyle = "#4b3020";
            ctx.fillRect(p.x + 17, p.y + 8, 55, 6);

            ctx.fillStyle = "#e8c65a";
            ctx.fillRect(
                p.x + 17,
                p.y + 8,
                55 * progress,
                6
            );
        }
    }
}

// -----------------------------
// DIBUJAR ZOMBIS
// -----------------------------


function dibujarZombies() {
    for (const z of zombies) {
        ctx.font = "43px Arial";
        ctx.textAlign = "center";

        // Cuerpo del zombi
        ctx.font = "43px Arial";
        ctx.fillText(
            "🧟",
            z.emoji,
            z.x,
            z.y + 15
        );

        // Accesorios en la cabeza
        if (z.type === "cone") {
            ctx.font = "23px Arial";
            ctx.fillText(
                "🔺",
                z.x,
                z.y - 22
            );
        }

        if (z.type === "bucket") {
            ctx.font = "25px Arial";
            ctx.fillText(
                "🪣",
                z.x,
                z.y - 25
            );
        }

        // Barra de vida
        const width = z.type === "boss" ? 55 : 40;
        const percent = Math.max(0, z.hp / z.maxHp);

        ctx.fillStyle = "#4d2020";
        ctx.fillRect(
            z.x - width / 2,
            z.y - 35,
            width,
            6
        );

        ctx.fillStyle = "#d94c3b";
        ctx.fillRect(
            z.x - width / 2,
            z.y - 35,
            width * percent,
            6
        );

        // Efecto de congelación
        if (z.slow > 0) {
            ctx.fillStyle = "#9ce8ff";
            ctx.beginPath();
            ctx.arc(z.x, z.y - 45, 5, 0, Math.PI * 2);
            ctx.fill();
        }
    }
}

// -----------------------------
// DIBUJAR PROYECTILES Y SOLES
// -----------------------------

function dibujarProyectiles() {
    for (const b of bullets) {
        ctx.font = "22px Arial";
        ctx.fillText(
            b.ice ? "❄️" : "🟢",
            b.x,
            b.y
        );
    }
}

function dibujarSoles() {
    for (const s of suns) {
        ctx.font = "30px Arial";
        ctx.fillText("☀️", s.x, s.y);
    }
}

// -----------------------------
// DIBUJAR EXPLOSIONES
// -----------------------------

function dibujarEfectos() {
    for (const e of fx) {
        const progress = e.timer / e.maxTimer;

        ctx.beginPath();

        ctx.arc(
            e.x,
            e.y,
            e.radius * (1 - progress * 0.5),
            0,
            Math.PI * 2
        );

        ctx.fillStyle = `rgba(255,120,20,${progress * 0.5})`;
        ctx.fill();

        ctx.strokeStyle = `rgba(255,220,80,${progress})`;
        ctx.lineWidth = 5;
        ctx.stroke();
    }
}

// -----------------------------
// BUCLE PRINCIPAL
// -----------------------------

function dibujar() {
    dibujarTablero();
    dibujarPlantas();
    dibujarZombies();
    dibujarProyectiles();
    dibujarSoles();
    dibujarEfectos();
}

function loop() {
    actualizar();
    dibujar();

    requestAnimationFrame(loop);
}

// -----------------------------
// INICIAR
// -----------------------------

initUI();
configurarNivel(1);
pantallaInicio();
loop();

</script>
