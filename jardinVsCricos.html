<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jardín vs. Cricos</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background: #17251b;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    color: #a9ed79;
    margin-bottom: 12px;
}

#game {
    width: 900px;
    max-width: 100%;
    margin: auto;
    position: relative;
}

#topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
    padding: 10px;
    background: #344e32;
    border: 3px solid #20351f;
    border-radius: 10px 10px 0 0;
}

#sunCounter, #levelInfo {
    font-weight: bold;
    font-size: 17px;
}

#levelPanel {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    min-width: 145px;
}

#progressTrack {
    width: 130px;
    height: 12px;
    background: #263b23;
    border: 2px solid #20351f;
    border-radius: 10px;
    overflow: hidden;
}

#progressFill {
    width: 0%;
    height: 100%;
    background: #f3df78;
    border-radius: 10px;
    transition: width 0.2s ease;
}

#plantCards {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
    justify-content: center;
}

.plant-card {
    position: relative;
    width: 68px;
    height: 76px;
    background: #d9c88c;
    border: 3px solid #79683c;
    border-radius: 7px;
    color: #222;
    cursor: pointer;
    padding: 3px;
    overflow: hidden;
}

.plant-card.selected {
    border-color: #fff;
    background: #a9e78c;
}

.plant-card.disabled {
    filter: brightness(.55);
}

.plant-card.locked {
    background: #5b5548;
    border-color: #36322a;
    color: #cfc8b8;
    filter: none;
}

.plant-card .emoji {
    display: block;
    font-size: 27px;
}

.plant-card .cost {
    font-size: 12px;
    font-weight: bold;
}

.cooldown {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,.55);
    transform-origin: bottom;
    pointer-events: none;
}

.side-controls {
    display: flex;
    flex-direction: column;
    gap: 5px;
}

#shovel {
    width: 68px;
    height: 40px;
    border: 3px solid #79683c;
    border-radius: 7px;
    background: #b6a477;
    font-size: 20px;
    cursor: pointer;
}

#shovel.selected {
    border-color: white;
    background: #a9e78c;
}

#almanacBtn {
    width: 68px;
    height: 31px;
    border: 2px solid #8a7846;
    border-radius: 6px;
    background: #ead99c;
    color: #26351d;
    font-size: 11px;
    font-weight: bold;
    cursor: pointer;
}

#almanacBtn:hover {
    background: #f6e8b5;
}

#boardWrapper {
    position: relative;
}

canvas {
    display: block;
    width: 100%;
    height: auto;
    background: #77bd51;
    border: 3px solid #20351f;
    cursor: crosshair;
}

#overlay, #almanacModal {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,.72);
    pointer-events: none;
    z-index: 10;
}

#overlay.show, #almanacModal.show {
    display: flex;
    pointer-events: auto;
}

#almanacModal {
    z-index: 20;
}

#overlayBox {
    background: #e7d69b;
    color: #26351d;
    border: 5px solid #66532d;
    border-radius: 14px;
    padding: 25px;
    width: 80%;
    max-width: 440px;
}

#overlayBox h2 {
    margin-top: 0;
    font-size: 27px;
}

#overlayBox p {
    line-height: 1.5;
}

#overlayBox button {
    display: block;
    width: 100%;
    margin-top: 12px;
    padding: 12px;
    border: 0;
    border-radius: 8px;
    background: #4b923d;
    color: white;
    font-weight: bold;
    font-size: 16px;
    cursor: pointer;
}

#overlayBox button:hover {
    background: #36732d;
}

#almanacBox {
    background: #e7d69b;
    color: #26351d;
    border: 5px solid #66532d;
    border-radius: 14px;
    padding: 18px;
    width: 92%;
    max-width: 760px;
    max-height: 85%;
    display: flex;
    flex-direction: column;
    gap: 12px;
    text-align: left;
}

.almanac-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    border-bottom: 2px solid #b59e63;
    padding-bottom: 8px;
}

.almanac-header h2 {
    margin: 0;
    font-size: 22px;
}

.almanac-tabs {
    display: flex;
    gap: 8px;
}

.tab-btn {
    padding: 7px 14px;
    border: 2px solid #66532d;
    border-radius: 7px;
    background: #d5c182;
    color: #26351d;
    font-weight: bold;
    cursor: pointer;
}

.tab-btn.active {
    background: #4b923d;
    color: white;
}

.close-btn {
    padding: 7px 12px;
    border: 0;
    border-radius: 7px;
    background: #a8382b;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

.almanac-body {
    display: grid;
    grid-template-columns: 1.15fr 1fr;
    gap: 14px;
    overflow-y: auto;
}

.almanac-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(92px, 1fr));
    gap: 8px;
    align-content: start;
}

.almanac-item {
    background: #f5eac4;
    border: 2px solid #8a7340;
    border-radius: 8px;
    padding: 8px 6px;
    text-align: center;
    cursor: pointer;
}

.almanac-item.active {
    border-color: #2e7d22;
    background: #d7f2c9;
}

.almanac-item.locked {
    background: #9c9278;
    opacity: 0.85;
}

.almanac-item .icon {
    font-size: 28px;
    display: block;
}

.almanac-item .label {
    font-size: 11px;
    font-weight: bold;
    margin-top: 4px;
    display: block;
}

.almanac-detail {
    background: #f5eac4;
    border: 2px solid #8a7340;
    border-radius: 10px;
    padding: 14px;
}

.almanac-detail h3 {
    margin: 0 0 6px;
    font-size: 20px;
}

.almanac-stats {
    font-size: 13px;
    background: #e7d7a3;
    padding: 8px 10px;
    border-radius: 7px;
    margin: 10px 0;
    line-height: 1.5;
}

.almanac-lore {
    font-style: italic;
    font-size: 13px;
    color: #4a3c20;
    border-left: 3px solid #66532d;
    padding-left: 8px;
    margin-top: 10px;
}

@media (max-width: 680px) {
    .almanac-body {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<h1>🌻 Jardín vs. Cricos 🧟 REMASTERED</h1>

<div id="game">

    <div id="topbar">
        <div id="sunCounter">☀️ 150</div>
        <div id="plantCards"></div>
        <div class="side-controls">
            <button id="shovel" title="Pala">🪓</button>
            <button id="almanacBtn" onclick="abrirAlmanaque()">📖 Almanaque</button>
        </div>
        <div id="levelPanel">
            <div id="levelInfo">Nivel 1</div>
            <div id="progressTrack">
                <div id="progressFill"></div>
            </div>
        </div>
    </div>

    <div id="boardWrapper">
        <canvas id="canvas" width="900" height="500"></canvas>

        <div id="overlay">
            <div id="overlayBox"></div>
        </div>

        <div id="almanacModal">
            <div id="almanacBox">
                <div class="almanac-header">
                    <h2>📖 Almanaque Suburbano</h2>
                    <div class="almanac-tabs">
                        <button class="tab-btn active" id="tabPlants" onclick="cambiarTabAlmanaque('plants')">🌱 Plantas</button>
                        <button class="tab-btn" id="tabZombies" onclick="cambiarTabAlmanaque('zombies')">🧟 Cricos</button>
                        <button class="close-btn" onclick="cerrarAlmanaque()">✕</button>
                    </div>
                </div>
                <div class="almanac-body">
                    <div class="almanac-grid" id="almanacList"></div>
                    <div class="almanac-detail" id="almanacDetail"></div>
                </div>
            </div>
        </div>
    </div>

</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const CELL_W = 90;
const CELL_H = 100;
const ROWS = 5;
const COLS = 9;
const OFFSET = 90;

const STORAGE_KEY = "jardin_vs_cricos_shadowpea_unlocked";
let shadowPeaUnlocked = localStorage.getItem(STORAGE_KEY) === "true";

let state = "MENU";
let previousStateBeforeAlmanac = "PLAYING";
let sun = 150;
let level = 1;
let frame = 0;
let tool = null;
let nextZombieId = 1;

let plants = [];
let zombies = [];
let bullets = [];
let suns = [];
let mowers = [];
let fx = [];

let spawned = 0;
let killed = 0;

let infiniteMode = false;
let infiniteWave = 1;

const PLANTS = {
    sunflower: {
        name: "Girasol",
        cost: 50,
        hp: 100,
        emoji: "🌻",
        cd: 300,
        last: -1000,
        unlocked: true,
        role: "Producción solar",
        desc: "Genera soles extra cada cierto tiempo para desplegar más defensas.",
        lore: "No le importa si está nublado; siempre busca el lado luminoso del jardín."
    },

    peashooter: {
        name: "Lanzaguisantes",
        cost: 100,
        hp: 120,
        emoji: "🌱",
        cd: 300,
        last: -1000,
        unlocked: true,
        role: "Ataque básico",
        desc: "Dispara guisantes a los cricos que avanzan por su misma fila.",
        lore: "Practicar puntería contra latas vacías lo preparó para defender el patio."
    },

    puffshroom: {
        name: "Seta Desesporada",
        cost: 0,
        hp: 80,
        emoji: "🍄",
        cd: 220,
        last: -1000,
        unlocked: true,
        role: "Defensa gratuita (3 casillas)",
        desc: "No cuesta soles, pero solo alcanza a los cricos a menos de 3 casillas.",
        lore: "Pequeña, económica y sorprendentemente valiente frente a cricos gigantes."
    },

    wallnut: {
        name: "Nuez",
        cost: 50,
        hp: 600,
        emoji: "🥜",
        cd: 600,
        last: -1000,
        unlocked: true,
        role: "Bloqueo resistente",
        desc: "Soporta muchos mordiscos para frenar el avance enemigo.",
        lore: "La gente piensa que tener cáscara dura es aburrido hasta que muerde un crico."
    },

    snowpea: {
        name: "Hielaguisantes",
        cost: 175,
        hp: 120,
        emoji: "❄️",
        cd: 400,
        last: -1000,
        unlocked: true,
        role: "Ataque + Ralentización",
        desc: "Lanza guisantes helados que hacen daño y reducen a la mitad la velocidad.",
        lore: "Su aliento ártico mantiene fríos los ánimos incluso en las oleadas finales."
    },

    cherrybomb: {
        name: "Cereza",
        cost: 150,
        hp: 50,
        emoji: "🍒",
        cd: 900,
        last: -1000,
        unlocked: true,
        role: "Explosión en área",
        desc: "Detona tras un breve instante causando gran daño en un radio amplio.",
        lore: "El gemelo izquierdo quiere explotar; el derecho solo quiere ver fuegos artificiales."
    },

    potatoMine: {
        name: "Patatapum",
        cost: 25,
        hp: 100,
        emoji: "🥔",
        cd: 600,
        last: -1000,
        unlocked: true,
        role: "Mina terrestre",
        desc: "Tarda unos segundos en armarse bajo tierra y explota al contacto.",
        lore: "Prefiere meditar bajo tierra antes de dar una sorpresa explosiva."
    },

    shadowpea: {
        name: "Lanzaguisantes Sombrío",
        cost: 150,
        hp: 140,
        emoji: "🌑",
        cd: 420,
        last: -1000,
        unlocked: shadowPeaUnlocked,
        role: "Especial perforante y gélido",
        desc: "Dispara orbes sombríos que atraviesan a todos los cricos de la fila y los ralentizan.",
        lore: "Despertó tras salvar los 5 niveles; su sombra no perdona a ninguna fila."
    }
};

const ZOMBIES = {
    normal: {
        name: "Crico Normal",
        hp: 120,
        armorHp: 0,
        speed: 0.45,
        damage: 0.5,
        emoji: "🧟",
        desc: "Crico estándar de avance constante.",
        lore: "Su pasatiempo favorito es caminar en línea recta hacia las plantas."
    },

    cone: {
        name: "Crico Caracono",
        hp: 120,
        armorHp: 140,
        speed: 0.45,
        damage: 0.5,
        emoji: "🧟",
        hatType: "cone",
        desc: "Lleva un cono naranja en la cabeza que absorbe daño extra antes de caer.",
        lore: "Consiguió el cono en una obra vial y decidió usarlo como sombrero de gala."
    },

    bucket: {
        name: "Crico Caracubo",
        hp: 120,
        armorHp: 360,
        speed: 0.4,
        damage: 0.6,
        emoji: "🧟",
        hatType: "bucket",
        desc: "Porta un balde metálico resistente que se desprende al romperse.",
        lore: "El eco dentro de su balde suena a tambor cada vez que recibe un guisante."
    },

    runner: {
        name: "Crico Veloz",
        hp: 140,
        armorHp: 0,
        speed: 0.9,
        damage: 0.5,
        emoji: "🏃",
        desc: "Avanza al doble de velocidad que un crico común.",
        lore: "Nunca se pierde el calentamiento antes de invadir un jardín."
    },

    boss: {
        name: "Crico Robot",
        hp: 900,
        armorHp: 300,
        speed: 0.3,
        damage: 1.5,
        emoji: "🤖",
        hatType: "visor",
        desc: "Blindaje pesado y golpe potente; aparece en el nivel 5 y oleadas altas.",
        lore: "Ensamblado con chatarra reforzada para aguantar descargas continuas."
    }
};

const LEVELS = {
    1: {
        total: 8,
        rate: 380,
        types: ["normal"],
        sun: 150
    },

    2: {
        total: 14,
        rate: 320,
        types: ["normal", "cone"],
        sun: 150
    },

    3: {
        total: 20,
        rate: 260,
        types: ["normal", "cone", "runner"],
        sun: 200
    },

    4: {
        total: 28,
        rate: 210,
        types: ["normal", "cone", "bucket", "runner"],
        sun: 200
    },

    5: {
        total: 38,
        rate: 170,
        types: ["normal", "cone", "bucket", "runner", "boss"],
        sun: 250
    }
};

let currentConfig = LEVELS[1];

// -----------------------------
// INTERFAZ
// -----------------------------

function initUI() {
    const container = document.getElementById("plantCards");
    container.innerHTML = "";

    for (const [key, plant] of Object.entries(PLANTS)) {
        const card = document.createElement("button");

        card.className = "plant-card";
        card.id = "card-" + key;

        card.innerHTML = `
            <span class="emoji" id="emoji-${key}">${plant.unlocked ? plant.emoji : "🔒"}</span>
            <span class="cost" id="cost-${key}">${plant.unlocked ? ☀️ ${plant.cost} : "Nivel 5"}</span>
            <div class="cooldown" id="cooldown-${key}"></div>
        `;

        card.title = plant.unlocked
            ? ${plant.name} (${plant.cost})
            : ${plant.name} — Completa el Nivel 5 para desbloquear;

        card.onclick = () => elegirHerramienta(key);

        container.appendChild(card);
    }

    document.getElementById("shovel").onclick = () => {
        if (state !== "PLAYING") return;

        tool = tool === "shovel" ? null : "shovel";
        actualizarUI();
    };
}

function sincronizarDesbloqueoSombrio() {
    PLANTS.shadowpea.unlocked = shadowPeaUnlocked;
    const emojiEl = document.getElementById("emoji-shadowpea");
    const costEl = document.getElementById("cost-shadowpea");
    const cardEl = document.getElementById("card-shadowpea");

    if (emojiEl && costEl && cardEl) {
        emojiEl.textContent = shadowPeaUnlocked ? PLANTS.shadowpea.emoji : "🔒";
        costEl.textContent = shadowPeaUnlocked ? ☀️ ${PLANTS.shadowpea.cost} : "Nivel 5";
        cardEl.title = shadowPeaUnlocked
            ? ${PLANTS.shadowpea.name} (${PLANTS.shadowpea.cost})
            : ${PLANTS.shadowpea.name} — Completa el Nivel 5 para desbloquear;
    }
}

function elegirHerramienta(type) {
    if (state !== "PLAYING") return;

    const p = PLANTS[type];
    if (!p || !p.unlocked) return;

    if (sun < p.cost) return;

    tool = tool === type ? null : type;
    actualizarUI();
}

function actualizarUI() {
    document.getElementById("sunCounter").textContent = "☀️ " + sun;

    document.getElementById("levelInfo").textContent =
        infiniteMode
            ? "Infinito - Oleada " + infiniteWave
            : "Nivel " + level;

    const progress = currentConfig.total > 0
        ? Math.min(100, (killed / currentConfig.total) * 100)
        : 0;

    document.getElementById("progressFill").style.width = progress + "%";

    for (const [key, plant] of Object.entries(PLANTS)) {
        const card = document.getElementById("card-" + key);
        const cooldown = document.getElementById("cooldown-" + key);
        if (!card || !cooldown) continue;

        if (!plant.unlocked) {
            card.classList.add("locked");
            card.classList.remove("selected", "disabled");
            cooldown.style.transform = "scaleY(0)";
            continue;
        }

        card.classList.remove("locked");

        const elapsed = Math.max(0, frame - (plant.last ?? -1000));
        const remaining = Math.max(0, plant.cd - elapsed);

        card.classList.toggle("selected", tool === key);
        card.classList.toggle("disabled", sun < plant.cost || remaining > 0);

        cooldown.style.transform = scaleY(${remaining / plant.cd});
    }

    document.getElementById("shovel").classList.toggle(
        "selected",
        tool === "shovel"
    );
}

// -----------------------------
// ALMANAQUE
// -----------------------------

let almanacTab = "plants";
let selectedAlmanacKey = "sunflower";

function abrirAlmanaque() {
    if (state === "ALMANAC") return;
    previousStateBeforeAlmanac = state;
    state = "ALMANAC";
    almanacTab = "plants";
    selectedAlmanacKey = "sunflower";
    renderAlmanaque();
    document.getElementById("almanacModal").classList.add("show");
}

function cerrarAlmanaque() {
    document.getElementById("almanacModal").classList.remove("show");
    state = previousStateBeforeAlmanac;
    actualizarUI();
}

function cambiarTabAlmanaque(tab) {
    almanacTab = tab;
    document.getElementById("tabPlants").classList.toggle("active", tab === "plants");
    document.getElementById("tabZombies").classList.toggle("active", tab === "zombies");
    selectedAlmanacKey = tab === "plants" ? "sunflower" : "normal";
    renderAlmanaque();
}

function renderAlmanaque() {
    const listEl = document.getElementById("almanacList");
    listEl.innerHTML = "";

    const source = almanacTab === "plants" ? PLANTS : ZOMBIES;

    for (const [key, item] of Object.entries(source)) {
        const isLocked = almanacTab === "plants" && !item.unlocked;
        const div = document.createElement("div");
        div.className = "almanac-item" +
            (selectedAlmanacKey === key ? " active" : "") +
            (isLocked ? " locked" : "");

        div.innerHTML = `
            <span class="icon">${isLocked ? "🔒" : item.emoji}</span>
            <span class="label">${item.name}</span>
        `;

        div.onclick = () => {
            selectedAlmanacKey = key;
            renderAlmanaque();
        };

        listEl.appendChild(div);
    }

    renderDetalleAlmanaque();
}

function renderDetalleAlmanaque() {
    const detailEl = document.getElementById("almanacDetail");
    const source = almanacTab === "plants" ? PLANTS : ZOMBIES;
    const item = source[selectedAlmanacKey] || Object.values(source)[0];

    if (almanacTab === "plants") {
        const estadoTexto = item.unlocked
            ? "Disponible"
            : "Bloqueada — Completa el Nivel 5 para desbloquear";

        detailEl.innerHTML = `
            <h3>${item.unlocked ? item.emoji : "🔒"} ${item.name}</h3>
            <div><strong>Estado:</strong> ${estadoTexto}</div>
            <div class="almanac-stats">
                <strong>Costo:</strong> ☀️ ${item.cost}<br>
                <strong>Resistencia:</strong> ${item.hp} HP<br>
                <strong>Rol:</strong> ${item.role}
            </div>
            <p>${item.desc}</p>
            <div class="almanac-lore">"${item.lore}"</div>
        `;
    } else {
        const totalHp = item.hp + (item.armorHp || 0);
        const armorNote = item.armorHp > 0
            ? ` (Cuerpo: ${item.hp} + Accesorio: ${item.armorHp})`
            : "";

        detailEl.innerHTML = `
            <h3>${item.emoji} ${item.name}</h3>
            <div class="almanac-stats">
                <strong>Resistencia total:</strong> ${totalHp} HP${armorNote}<br>
                <strong>Velocidad:</strong> ${item.speed.toFixed(2)}<br>
                <strong>Daño:</strong> ${item.damage}
            </div>
            <p>${item.desc}</p>
            <div class="almanac-lore">"${item.lore}"</div>
        `;
    }
}

// -----------------------------
// CONFIGURACIÓN DE NIVELES
// -----------------------------

function configurarNivel(n) {
    currentConfig = LEVELS[n];

    sun = currentConfig.sun;
    frame = 0;

    plants = [];
    zombies = [];
    bullets = [];
    suns = [];
    fx = [];

    spawned = 0;
    killed = 0;
    tool = null;

    mowers = [];

    for (let r = 0; r < ROWS; r++) {
        mowers.push({
            row: r,
            x: OFFSET - 45,
            active: true,
            moving: false
        });
    }

    for (const p of Object.values(PLANTS)) {
        p.last = -1000;
    }

    actualizarUI();
}

function configurarOleadaInfinita() {
    const wave = infiniteWave;

    const types = ["normal"];

    if (wave >= 2) types.push("cone");
    if (wave >= 3) types.push("runner");
    if (wave >= 4) types.push("bucket");
    if (wave >= 6) types.push("boss");

    currentConfig = {
        total: 10 + wave * 3,
        rate: Math.max(65, 180 - wave * 8),
        types: types
    };

    frame = 0;
    spawned = 0;
    killed = 0;
    tool = null;

    for (const p of Object.values(PLANTS)) {
        p.last = -1000;
    }

    zombies = [];
    bullets = [];
    suns = [];
    fx = [];

    actualizarUI();
}

function iniciarJuego() {
    infiniteMode = false;
    infiniteWave = 1;
    level = 1;

    configurarNivel(level);

    state = "PLAYING";
    ocultarOverlay();
}

function siguienteNivel() {
    level++;

    configurarNivel(level);

    state = "PLAYING";
    ocultarOverlay();
}

function iniciarInfinito() {
    infiniteMode = true;
    infiniteWave = 1;

    configurarNivel(5);
    configurarOleadaInfinita();

    state = "PLAYING";
    ocultarOverlay();
}

function reiniciarJuego() {
    iniciarJuego();
}

// -----------------------------
// OVERLAYS
// -----------------------------

function mostrarOverlay(title, message, buttons) {

    const box = document.getElementById("overlayBox");

    box.innerHTML = `
        <h2>${title}</h2>
        <p>${message}</p>
        ${buttons}
    `;

    overlay.classList.add("show");
}

function ocultarOverlay() {
    document.getElementById("overlay").classList.remove("show");
}

function pantallaInicio() {
    state = "MENU";

    mostrarOverlay(
        "🌻 Jardín vs. Cricos",
        "¡Defiende tu jardín de los cricos!<br>Coloca plantas, recoge soles y evita que lleguen a tu casa.",
        <button onclick="iniciarJuego()">Comenzar campaña</button>
    );
}

function pantallaGameOver() {
    state = "GAMEOVER";

    const extra = infiniteMode
        ? <p>Oleadas superadas: ${infiniteWave - 1}</p>
        : <p>Llegaste al nivel ${level}.</p>;

    mostrarOverlay(
        "🧟 ¡Los cricos ganaron!",
        extra + " Tu jardín ha sido invadido.",
        <button onclick="reiniciarJuego()">Volver a empezar</button>
    );
}

function pantallaNivelCompletado() {

        "Has eliminado a todos los cricos de este nivel.",
        <button onclick="siguienteNivel()">Siguiente nivel</button>
    );
}

function pantallaVictoria() {
    state = "WON";

    const wasAlreadyUnlocked = shadowPeaUnlocked;
    shadowPeaUnlocked = true;
    localStorage.setItem(STORAGE_KEY, "true");
    sincronizarDesbloqueoSombrio();
    actualizarUI();

    const rewardMsg = wasAlreadyUnlocked
        ? "El <strong>Lanzaguisantes Sombrío</strong> sigue listo para arrasar en el modo infinito."
        : "🌑 ¡Has desbloqueado al <strong>Lanzaguisantes Sombrío</strong>! Sus orbes atraviesan filas completas y ralentizan a los cricos.";

    mostrarOverlay(
        "🏆 ¡Jardín salvado!",
        ¡Completaste los cinco niveles de la campaña!<br><br>${rewardMsg}<br><br>Has desbloqueado el modo infinito. ¿Cuántas oleadas podrás resistir?,
        `
        <button onclick="iniciarInfinito()">♾️ Jugar modo infinito</button>

}

function pantallaSiguienteOleada() {
    state = "WAVE";

    mostrarOverlay(
        "¡Oleada superada! 🌻",
        Has sobrevivido a la oleada ${infiniteWave}.<br>La siguiente será más difícil.,
        <button onclick="continuarInfinito()">Siguiente oleada</button>
    );
}

function continuarInfinito() {
    infiniteWave++;

    sun += 50;

    configurarOleadaInfinita();

    state = "PLAYING";
    ocultarOverlay();
}

// -----------------------------
// COLOCAR Y QUITAR PLANTAS
// -----------------------------

function obtenerPlanta(col, row) {
    return plants.find(p => p.col === col && p.row === row);
}

function colocarPlanta(col, row, type) {
    const data = PLANTS[type];

    if (!data || !data.unlocked) return;

    if (obtenerPlanta(col, row)) return;

    if (sun < data.cost) return;

    const remaining = data.cd - (frame - data.last);

    if (remaining > 0) return;

    sun -= data.cost;
    data.last = frame;

    plants.push({
        col,
        row,
        x: OFFSET + col * CELL_W,
        y: row * CELL_H,
        type,
        hp: data.hp,
        maxHp: data.hp,
        timer: 0,
        armed: false
    });

    tool = null;
    actualizarUI();
}

function quitarPlanta(col, row) {
    const index = plants.findIndex(
        p => p.col === col && p.row === row
    );

    if (index !== -1) {
        plants.splice(index, 1);
    }

    tool = null;
    actualizarUI();
}

// -----------------------------
// EVENTOS DEL CANVAS
// -----------------------------

canvas.addEventListener("click", function(e) {
    if (state !== "PLAYING") return;

    const rect = canvas.getBoundingClientRect();

    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;

    const x = (e.clientX - rect.left) * scaleX;
    const y = (e.clientY - rect.top) * scaleY;

    // Recoger soles.
    for (let i = suns.length - 1; i >= 0; i--) {
        const s = suns[i];

        if (Math.hypot(x - s.x, y - s.y) < 35) {
            sun += s.value;
            suns.splice(i, 1);
            actualizarUI();
            return;
        }
    }

    const col = Math.floor((x - OFFSET) / CELL_W);
    const row = Math.floor(y / CELL_H);

    if (col < 0 || col >= COLS || row < 0 || row >= ROWS) {
        return;
    }

    if (tool === "shovel") {
        quitarPlanta(col, row);
        return;
    }

    if (tool && PLANTS[tool]) {
        colocarPlanta(col, row, tool);
    }
});

// -----------------------------
// GENERACIÓN DE ZOMBIS
// -----------------------------

function crearZombie() {
    if (spawned >= currentConfig.total) return;

    const type = currentConfig.types[
        Math.floor(Math.random() * currentConfig.types.length)
    ];

    const data = ZOMBIES[type];

    let hpMultiplier = 1;
    let speedMultiplier = 1;

    if (infiniteMode) {
        hpMultiplier = 1 + (infiniteWave - 1) * 0.12;
        speedMultiplier = Math.min(
            1.6,
            1 + (infiniteWave - 1) * 0.025
        );
    }

    const row = Math.floor(Math.random() * ROWS);
    const bodyHp = data.hp * hpMultiplier;
    const armorHp = (data.armorHp || 0) * hpMultiplier;

    zombies.push({
        id: nextZombieId++,
        x: 920,
        y: row * CELL_H + 50,
        row,
        type,
        hp: bodyHp,
        maxHp: bodyHp,
        armorHp: armorHp,
        maxArmorHp: armorHp,
        hatType: data.hatType || null,
        hatDropped: false,
        fallingHat: null,
        speed: data.speed * speedMultiplier,
        damage: data.damage,
        emoji: data.emoji,
        attackTimer: 0,
        slow: 0
    });

    spawned++;
}

function aplicarDanioZombie(zombie, amount) {
    let remainingDamage = amount;

    if (zombie.armorHp > 0) {
        if (remainingDamage >= zombie.armorHp) {
            remainingDamage -= zombie.armorHp;
            zombie.armorHp = 0;

            if (zombie.hatType && !zombie.hatDropped) {
                zombie.hatDropped = true;
                zombie.fallingHat = {
                    type: zombie.hatType,
                    x: zombie.x,
                    y: zombie.y - 22,
                    vy: -2.2,
                    vx: 1.1,
                    rot: 0,
                    vRot: 0.08,
                    alpha: 1
                };
            }
        } else {
            zombie.armorHp -= remainingDamage;
            remainingDamage = 0;
        }
    }

    if (remainingDamage > 0) {
        zombie.hp -= remainingDamage;
    }
}

// -----------------------------
// EXPLOSIONES
// -----------------------------

function explosion(x, y, radius, damage) {
    fx.push({
        x,
        y,
        radius,
        timer: 35,
        maxTimer: 35
    });

    for (const z of zombies) {
        const distance = Math.hypot(z.x - x, z.y - y);

        if (distance <= radius) {
            aplicarDanioZombie(z, damage);
        }
    }
}

// -----------------------------
// ACTUALIZACIÓN DEL JUEGO
// -----------------------------

function actualizar() {
    if (state !== "PLAYING") return;

    frame++;

    // Generar soles.
    if (frame % 350 === 0) {
        suns.push({
            x: OFFSET + Math.random() * (COLS * CELL_W),
            y: 20,
            targetY: 70 + Math.random() * 300,
            value: 50,
            timer: 600
        });
    }

    // Generar zombis.
    if (
        spawned < currentConfig.total &&
        frame % currentConfig.rate === 0
    ) {
        crearZombie();
    }

    // Movimiento de soles.
    for (let i = suns.length - 1; i >= 0; i--) {
        const s = suns[i];

        if (s.y < s.targetY) {
            s.y += 1.2;
        }

        s.timer--;

        if (s.timer <= 0) {
            suns.splice(i, 1);
        }
    }

    // Actualizar plantas.
    for (let i = plants.length - 1; i >= 0; i--) {
        const p = plants[i];

        p.timer++;

        // Girasol.
        if (p.type === "sunflower") {
            if (p.timer % 1080 === 0) {
                suns.push({
                    x: p.x + 45,
                    y: p.y + 35,
                    targetY: p.y + 70,
                    value: 50,
                    timer: 600
                });
            }
        }

        // Lanzaguisantes y hielaguisantes.
        if (
            p.type === "peashooter" ||
            p.type === "snowpea"
        ) {
            const enemyInRow = zombies.some(
                z => z.row === p.row && z.x > p.x
            );

            if (enemyInRow && p.timer % 125 === 0) {
                bullets.push({
                    x: p.x + 65,
                    y: p.y + 50,
                    row: p.row,
                    damage: 25,
                    ice: p.type === "snowpea",
                    piercing: false,
                    hitIds: []
                });
            }
        }

        // Seta Desesporada (alcance de 3 casillas hacia adelante).
        if (p.type === "puffshroom") {
            const maxRangeX = p.x + CELL_W * 3;
            const enemyInRange = zombies.some(
                z => z.row === p.row && z.x > p.x && z.x <= maxRangeX
            );

            if (enemyInRange && p.timer % 110 === 0) {
                bullets.push({
                    x: p.x + 55,
                    y: p.y + 52,
                    row: p.row,
                    damage: 18,
                    spore: true,
                    maxX: maxRangeX + 20,
                    piercing: false,
                    hitIds: []
                });
            }
        }

        // Lanzaguisantes Sombrío (perforante + ralentiza).
        if (p.type === "shadowpea") {
            const enemyInRow = zombies.some(
                z => z.row === p.row && z.x > p.x
            );

            if (enemyInRow && p.timer % 135 === 0) {
                bullets.push({
                    x: p.x + 65,
                    y: p.y + 50,
                    row: p.row,
                    damage: 35,
                    ice: true,
                    shadow: true,
                    piercing: true,
                    hitIds: []
                });
            }
        }

        // CEREZA EXPLOSIVA.
        if (p.type === "cherrybomb") {
            if (p.timer >= 45) {
                explosion(
                    p.x + 45,
                    p.y + 50,
                    160,
                    800
                );

                plants.splice(i, 1);
            }
        }

        // PATATAPUM.
        if (p.type === "potatoMine") {
            if (p.timer >= 900) {
                p.armed = true;
            }

            if (p.armed) {
                const touchingZombie = zombies.some(z =>
                    z.row === p.row &&
                    z.x >= p.x + 5 &&
                    z.x <= p.x + 85
                );

                if (touchingZombie) {
                    explosion(
                        p.x + 45,
                        p.y + 50,
                        115,
                        2000
                    );

                    plants.splice(i, 1);
                }
            }
        }

        if (p.hp <= 0) {
            plants.splice(i, 1);
        }
    }

    // Actualizar proyectiles.
    for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];

        b.x += b.spore ? 5 : 6;

        let removeBullet = false;

        for (let zIdx = 0; zIdx < zombies.length; zIdx++) {
            const z = zombies[zIdx];

            if (
                z.row === b.row &&
                Math.abs(z.x - b.x) < 28 &&
                !b.hitIds.includes(z.id)
            ) {
                aplicarDanioZombie(z, b.damage);
                b.hitIds.push(z.id);

                if (b.ice) {
                    z.slow = 180;
                }

                if (!b.piercing) {
                    removeBullet = true;
                    break;
                }
            }
        }

        if (b.maxX && b.x > b.maxX) {
            removeBullet = true;
        }

        if (removeBullet || b.x > 920) {
            bullets.splice(i, 1);
        }
    }

    // Actualizar zombis y accesorios cayendo.
    for (let i = zombies.length - 1; i >= 0; i--) {
        const z = zombies[i];

        if (z.fallingHat) {
            z.fallingHat.x += z.fallingHat.vx;
            z.fallingHat.y += z.fallingHat.vy;
            z.fallingHat.vy += 0.16;
            z.fallingHat.rot += z.fallingHat.vRot;
            z.fallingHat.alpha -= 0.025;
            if (z.fallingHat.alpha <= 0) {
                z.fallingHat = null;
            }
        }

        if (z.hp <= 0) {
            zombies.splice(i, 1);
            killed++;
            continue;
        }

        if (z.slow > 0) {
            z.slow--;
        }

        const plant = plants.find(p =>
            p.row === z.row &&
            z.x >= p.x + 15 &&
            z.x <= p.x + 80
        );

        if (plant) {
            if (plant.type === "potatoMine") {
                if (!plant.armed) {
                    z.x -= z.slow > 0 ? z.speed * 0.5 : z.speed;
                }
            } else {
                z.attackTimer++;

                if (z.attackTimer % 60 === 0) {
                    plant.hp -= z.damage * 60;
                }
            }
        } else {
            z.x -= z.slow > 0
                ? z.speed * 0.5
                : z.speed;
        }

        // Si llega a la izquierda, activa el cortacésped.
        if (z.x < OFFSET - 10) {
            const mower = mowers[z.row];

            if (mower.active && !mower.moving) {
                mower.moving = true;
            } else if (!mower.active) {
                pantallaGameOver();
                return;
            }
        }
    }

    // Cortacéspedes.
    for (const mower of mowers) {
        if (!mower.moving) continue;

        mower.x += 8;

        for (let i = zombies.length - 1; i >= 0; i--) {
            const z = zombies[i];

            if (
                z.row === mower.row &&
                Math.abs(z.x - mower.x) < 45
            ) {
                zombies.splice(i, 1);
                killed++;
            }
        }

        if (mower.x > 920) {
            mower.active = false;
            mower.moving = false;
        }
    }

    // Efectos de explosiones.
    for (let i = fx.length - 1; i >= 0; i--) {
        fx[i].timer--;

        if (fx[i].timer <= 0) {
            fx.splice(i, 1);
        }
    }

    // Comprobar final de oleada o nivel.
    if (
        spawned >= currentConfig.total &&
        zombies.length === 0
    ) {
        if (infiniteMode) {
            pantallaSiguienteOleada();
        } else if (level < 5) {
            pantallaNivelCompletado();
        } else {
            pantallaVictoria();
        }

        return;
    }

    if (frame % 10 === 0) {
        actualizarUI();
    }
}

// -----------------------------
// DIBUJAR TABLERO
// -----------------------------

function dibujarTablero() {
    ctx.fillStyle = "#78bd50";
    ctx.fillRect(0, 0, 900, 500);

    for (let row = 0; row < ROWS; row++) {
        for (let col = 0; col < COLS; col++) {
            ctx.fillStyle =
                (row + col) % 2 === 0
                    ? "#8bcf62"
                    : "#80c456";

            ctx.fillRect(
                OFFSET + col * CELL_W,
                row * CELL_H,
                CELL_W,
                CELL_H
            );

            ctx.strokeStyle = "rgba(40,90,30,.2)";
            ctx.strokeRect(
                OFFSET + col * CELL_W,
                row * CELL_H,
                CELL_W,
                CELL_H
            );
        }
    }

    // Casa.
    ctx.fillStyle = "#d4b47a";
    ctx.fillRect(0, 0, OFFSET, 500);

    // Cortacéspedes.
    for (const mower of mowers) {
        if (mower.active) {
            ctx.font = "35px Arial";
            ctx.fillText(
                "🚜",
                mower.x,
                mower.row * CELL_H + 65
            );
        }
    }
}

// -----------------------------
// DIBUJAR PLANTAS
// -----------------------------

function dibujarPlantas() {
    for (const p of plants) {
        const data = PLANTS[p.type];

        ctx.font = "42px Arial";
        ctx.textAlign = "center";

        let emoji = data.emoji;

        if (p.type === "potatoMine") {
            emoji = p.armed ? "🥔" : "🟤";
        }

        ctx.fillText(
            emoji,
            p.x + 45,
            p.y + 65
        );

        // Barra de vida.
        if (
            p.type !== "potatoMine" ||
            p.armed
        ) {
            const width = 55;
            const hpPercent = Math.max(0, p.hp / p.maxHp);

            ctx.fillStyle = "#542b20";
            ctx.fillRect(p.x + 17, p.y + 8, width, 6);

            ctx.fillStyle = p.type === "shadowpea" ? "#9b59b6" : "#5ae052";
            ctx.fillRect(
                p.x + 17,
                p.y + 8,
                width * hpPercent,
                6
            );
        }

        // Indicador de preparación de Patatapum.
        if (
            p.type === "potatoMine" &&
            !p.armed
        ) {
            const progress = Math.min(1, p.timer / 900);

            ctx.fillStyle = "#4b3020";
            ctx.fillRect(p.x + 17, p.y + 8, 55, 6);

            ctx.fillStyle = "#e8c65a";
            ctx.fillRect(
                p.x + 17,
                p.y + 8,
                55 * progress,
                6
            );
        }
    }
}

// -----------------------------
// DIBUJAR CONO, BALDE Y ZOMBIS
// -----------------------------

function dibujarAccesorioCabeza(type, x, y, rot = 0, alpha = 1) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.globalAlpha = Math.max(0, alpha);

    if (type === "cone") {
        ctx.beginPath();
        ctx.moveTo(-13, 4);
        ctx.lineTo(0, -24);
        ctx.lineTo(13, 4);
        ctx.closePath();
        ctx.fillStyle = "#ff7300";
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = "#9e3f00";
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(-8, -7);
        ctx.lineTo(8, -7);
        ctx.lineTo(10, -2);
        ctx.lineTo(-10, -2);
        ctx.closePath();
        ctx.fillStyle = "#fff4dc";
        ctx.fill();

        ctx.fillStyle = "#d95b00";
        ctx.fillRect(-15, 2, 30, 4);
    } else if (type === "bucket") {
        const grad = ctx.createLinearGradient(-14, 0, 14, 0);
        grad.addColorStop(0, "#7c878e");
        grad.addColorStop(0.5, "#ced6db");
        grad.addColorStop(1, "#69737a");

        ctx.beginPath();
        ctx.moveTo(-14, -18);
        ctx.lineTo(14, -18);
        ctx.lineTo(11, 3);
        ctx.lineTo(-11, 3);
        ctx.closePath();
        ctx.fillStyle = grad;
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = "#3f464b";
        ctx.stroke();

        ctx.fillStyle = "#9aa4ab";
        ctx.fillRect(-15, -20, 30, 4);

        ctx.beginPath();
        ctx.arc(0, -8, 13, Math.PI * 0.15, Math.PI * 0.85, false);
        ctx.strokeStyle = "#555f66";
        ctx.lineWidth = 2;
        ctx.stroke();
    } else if (type === "visor") {
        ctx.fillStyle = "#37474f";
        ctx.fillRect(-16, -15, 32, 11);
        ctx.strokeStyle = "#cfd8dc";
        ctx.lineWidth = 2;
        ctx.strokeRect(-16, -15, 32, 11);

        ctx.fillStyle = "#ff3d00";
        ctx.fillRect(-10, -11, 20, 4);
    }

    ctx.restore();
}

function dibujarZombies() {
    for (const z of zombies) {
        ctx.font = "43px Arial";
        ctx.textAlign = "center";

        ctx.fillText(
            z.emoji,
            z.x,
            z.y + 15
        );

        if (z.armorHp > 0 && z.hatType) {
            dibujarAccesorioCabeza(z.hatType, z.x + 1, z.y - 20, 0, 1);
        }

        if (z.fallingHat) {
            dibujarAccesorioCabeza(
                z.fallingHat.type,
                z.fallingHat.x,
                z.fallingHat.y,
                z.fallingHat.rot,
                z.fallingHat.alpha
            );
        }

        const width = z.type === "boss" ? 58 : 42;
        const hpPercent = Math.max(0, z.hp / z.maxHp);
        const armorPercent = z.maxArmorHp > 0
            ? Math.max(0, z.armorHp / z.maxArmorHp)
            : 0;

        ctx.fillStyle = "#4d2020";
        ctx.fillRect(
            z.x - width / 2,
            z.y - 46,
            width,
            6
        );

        ctx.fillStyle = "#d94c3b";
        ctx.fillRect(
            z.x - width / 2,
            z.y - 46,
            width * hpPercent,
            6
        );

        if (z.maxArmorHp > 0 && z.armorHp > 0) {
            ctx.fillStyle = "#3c2918";
            ctx.fillRect(
                z.x - width / 2,
                z.y - 53,
                width,
                5
            );

            ctx.fillStyle = z.hatType === "cone" ? "#ff8800" : "#b0bec5";
            ctx.fillRect(
                z.x - width / 2,
                z.y - 53,
                width * armorPercent,
                5
            );
        }

        if (z.slow > 0) {
            ctx.fillStyle = "#9ce8ff";
            ctx.beginPath();
            ctx.arc(z.x, z.y - 60, 5, 0, Math.PI * 2);
            ctx.fill();
        }
    }
}

// -----------------------------
// DIBUJAR PROYECTILES Y SOLES
// -----------------------------

function dibujarProyectiles() {
    for (const b of bullets) {
        if (b.spore) {
            ctx.beginPath();
            ctx.arc(b.x, b.y, 7, 0, Math.PI * 2);
            ctx.fillStyle = "#b55cff";
            ctx.fill();
            ctx.strokeStyle = "#5e1c9c";
            ctx.lineWidth = 2;
            ctx.stroke();
            continue;
        }

        if (b.shadow) {
            ctx.beginPath();
            ctx.arc(b.x, b.y, 11, 0, Math.PI * 2);
            ctx.fillStyle = "#3b1354";
            ctx.fill();
            ctx.strokeStyle = "#b366ff";
            ctx.lineWidth = 2.5;
            ctx.stroke();
            continue;
        }

        ctx.font = "22px Arial";
        ctx.fillText(
            b.ice ? "❄️" : "🟢",
            b.x,
            b.y
        );
    }
}

function dibujarSoles() {
    for (const s of suns) {
        ctx.font = "30px Arial";
        ctx.fillText("☀️", s.x, s.y);
    }
}

// -----------------------------
// DIBUJAR EXPLOSIONES
// -----------------------------

function dibujarEfectos() {
    for (const e of fx) {
        const progress = e.timer / e.maxTimer;

        ctx.beginPath();

        ctx.arc(
            e.x,
            e.y,
            e.radius * (1 - progress * 0.5),
            0,
            Math.PI * 2
        );

        ctx.fillStyle = rgba(255,120,20,${progress * 0.5});
        ctx.fill();

        ctx.strokeStyle = rgba(255,220,80,${progress});
        ctx.lineWidth = 5;
        ctx.stroke();
    }
}

// -----------------------------
// BUCLE PRINCIPAL
// -----------------------------

function dibujar() {
    dibujarTablero();
    dibujarPlantas();
    dibujarZombies();
    dibujarProyectiles();
    dibujarSoles();
    dibujarEfectos();
}

function loop() {
    actualizar();
    dibujar();

    requestAnimationFrame(loop);
}

// -----------------------------
// INICIAR
// -----------------------------

initUI();
configurarNivel(1);
pantallaInicio();
loop();

</script>
